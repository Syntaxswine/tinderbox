<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tinderbox · UI workbench</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./workbench.css"></head>
<body><main class="bench-stage">
  <div class="bench-field" aria-hidden="true"><div class="bench-line bench-line-a"></div><div class="bench-line bench-line-b"></div><div class="bench-line bench-line-c"></div></div>
  <aside class="bench-inspector" aria-label="UI workbench controls"><p class="bench-kicker">TB-006 / UI WORKBENCH</p><h1>Light the way.</h1><p class="bench-disclaimer">FAKE SNAPSHOTS · INPUT DIAGRAM ONLY</p><div class="bench-fixture"><label for="fixture">Snapshot</label><select id="fixture"><option value="ready">Ready / hurt</option><option value="pouring">Pouring + powder</option><option value="reversed">Inversion active</option><option value="low-stock">Low health / stock</option><option value="empty">All stock empty</option><option value="paused">Paused</option><option value="down">Bear down</option></select></div><p class="bench-note">Values and timers are fixed examples. Controls echo into snapshots; stocks, movement and fire are not simulated.</p><details><summary>Inspect commands</summary><ol id="command-log" aria-label="Recent emitted commands"></ol></details></aside>
  <div class="bench-vector" aria-label="Raw movement diagnostic"><svg viewBox="0 0 140 140" aria-hidden="true"><circle cx="70" cy="70" r="53"></circle><path class="vector-cross" d="M70 9v122M9 70h122"></path><path id="vector-arrow" d="M70 70h0"></path><circle class="vector-origin" cx="70" cy="70" r="5"></circle></svg><span>RAW STICK <output id="vector-value">0.00 / 0.00</output></span><small>Static input marker · no bear art</small><span id="trigger-state">TRIGGER UP</span></div>
  <output id="bench-error" hidden></output><div id="ui-root"></div>
</main><script type="module" src="./workbench.js"></script></body></html>
