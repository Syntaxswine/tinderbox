<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bell & Alder · Neighborhood sandbox</title>
<style>*{box-sizing:border-box}body{margin:0;background:#211912;color:#f3dfb7;font:14px Georgia,serif}#world{display:block;width:100vw;height:100vh;touch-action:none}#hud{position:absolute;inset:0}#review{position:absolute;left:12px;top:78px;z-index:30;max-width:300px;background:#2d211be8;border:1px solid #876e48;padding:9px}#review p{margin:4px}#review button,#review select{font:inherit;background:#4b3828;color:#ffe9bf;border:1px solid #95794f;padding:5px;margin:2px}#review details{margin-top:6px}#review label{display:inline-flex;align-items:center;gap:4px;margin:3px}#clock{font:bold 16px monospace}#fatal{position:absolute;top:35%;left:15%;right:15%;z-index:50;padding:20px;background:#5d2e1e}#fatal:empty{display:none}.recording #review{opacity:.9}.recording .tb-console{opacity:.85}@media(max-width:700px){#review{max-width:220px;font-size:11px}}</style>
<canvas id="world" tabindex="0"></canvas><div id="hud"></div><aside id="review"><strong>Bell & Alder · Sandbox</strong><p id="status">Loading experimental block…</p><p id="clock">0.00 s · 1×</p><div><button id="reset">Reset</button><button id="quiet">Quiet check</button><button id="play">Play / Pause</button></div><label>Speed <select id="speed"><option>1</option><option>2</option><option>4</option><option>8</option></select>×</label><button id="audio">Enable sound</button><label><input id="mute" type="checkbox">Mute</label><details><summary>Review controls</summary><label>View<select id="view"><option value="auto">Follow interiors</option><option value="exterior">Exterior</option><option value="cutaway">Cutaway</option></select></label><label>Floor<select id="level"><option>0</option><option>1</option></select></label><section id="effects"></section><button id="export">Export input/trace</button><pre id="metrics"></pre></details></aside><div id="fatal" role="alert"></div><script type="module" src="./main.js"></script></html>
