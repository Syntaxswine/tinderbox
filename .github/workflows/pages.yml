name: Publish reviewed Tinderbox
on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm run check
      - run: npm run build
      - run: node tools/check-release.mjs
      - uses: actions/configure-pages@v6
        if: vars.PAGES_ENABLED == 'true'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v5
